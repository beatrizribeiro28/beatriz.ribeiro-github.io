<input type="text" class="input-moderno" id="cep" name="CEP"

       placeholder="CEP 00000-0000" required>
		<br>
		<br>

			   placeholder="Data de nascimento" required>

		<br>
<div class="grupo-campo">
		<label for="cpf"></label>

			   placeholder="CPF 000.000.000-00" required>
		<br>
<br>

       <label for="telefone"></label>
        <input type="tel" class="input-moderno" id="telefone" name="telefone"

			   placeholder="Telefone DDD00000-0000" required>
<br>
<br>
<div class="grupo-campo">
			<label for="text"></label>

			<br>

<option value="Doações">
